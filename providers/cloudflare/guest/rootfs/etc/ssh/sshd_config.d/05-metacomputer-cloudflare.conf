# metacomputer on Cloudflare Containers: sshd on port 2222 (Cloudflare's own SSH server would hold 22; it's off for
# metacomputer's computers). Where it listens is written at every start by the boot script
# (06-metacomputer-cloudflare-listen.conf): the container's loopback and its own address, which is where the platform's
# TCP route from the computer's control Worker arrives. Nothing outside the container reaches it but that route.
Port 2222
