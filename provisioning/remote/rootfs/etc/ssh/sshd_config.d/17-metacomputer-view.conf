# metacomputer, on a computer reached over the internet: the live view (x11vnc on 127.0.0.1:5900) is reached only
# through SSH. The desktop user's view key (and no other: the others carry `restrict`) may open that one local
# forward, and nothing else; a session on it runs only a short sleep that keeps the tunnel up until the viewer
# connects (metacomputer view). Remote forwards, agent, X11 and tunnels stay off.
Match User cua
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:5900
	PermitListen none
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTunnel no
# Back to every user, so nothing read after this file falls under the block above.
Match all
