# metacomputer, on a VM with no display of its own (a cloud VM): Xorg draws into memory (the dummy driver) at
# 1920x1080, so LightDM, XFCE, AT-SPI and Cua Driver work as on the Mac's VM; input devices still come and go
# through udev (Cua Driver's virtual pointer, /dev/uinput).
Section "Device"
    Identifier "metacomputer-dummy"
    Driver     "dummy"
    VideoRam   256000
EndSection
Section "Monitor"
    Identifier  "metacomputer-monitor"
    HorizSync   5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline    "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection
Section "Screen"
    Identifier   "metacomputer-screen"
    Device       "metacomputer-dummy"
    Monitor      "metacomputer-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection
