# metacomputer secrets: the proxy account. While the vault on the Mac is unlocked and
# has handed out an API token, it signs in as mcproxy with a key only it holds and opens
# one reverse forward, 127.0.0.1:18765 inside the VM, to its API proxy on the
# Mac. The account may do nothing else: no command (nologin), no TTY, no rc files, no
# local or agent or X11 forwarding, and only that one listen address. Its key list is
# root-owned and outside its (root-owned, empty) home. provision.sh puts in SECRETS_PROXY_PORT
# when it isn't 18765. Always on: a locked, key-only account that can only offer one loopback port.
Match User mcproxy
	AuthorizedKeysFile /etc/ssh/metacomputer-proxy/authorized_keys
	AuthorizedPrincipalsFile none
	AuthenticationMethods publickey
	ForceCommand /usr/sbin/nologin
	PermitTTY no
	PermitUserRC no
	AllowTcpForwarding remote
	PermitListen 127.0.0.1:18765
	PermitOpen none
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTunnel no
	GatewayPorts no
# Back to every user, so nothing read after this file falls under the block above.
Match all
