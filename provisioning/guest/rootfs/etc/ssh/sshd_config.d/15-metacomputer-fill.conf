# metacomputer secrets: the fill account. `metacomputer secrets fill` signs in as
# mcfill with a key only the vault on the Mac holds, and sshd runs one program,
# whatever the client asks for. The key list is root-owned and outside the account's
# home; the account has no password, no TTY, no forwarding and no rc files (its home is
# root-owned and empty), so nothing the desktop user (cua) can change takes part.
# Always on: a locked, key-only account with a forced command opens nothing else.
Match User mcfill
	AuthorizedKeysFile /etc/ssh/metacomputer-fill/authorized_keys
	AuthorizedPrincipalsFile none
	AuthenticationMethods publickey
	ForceCommand /opt/metacomputer/bin/secret-fill
	PermitTTY no
	PermitUserRC no
	DisableForwarding yes
	AllowTcpForwarding no
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitListen none
	PermitOpen none
