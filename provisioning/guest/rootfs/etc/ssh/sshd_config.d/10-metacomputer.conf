# metacomputer: keys only, two named users, no forwarding. Reached only through the
# host's cua-netgw forward on 127.0.0.1.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers cua cuaadmin
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
ClientAliveInterval 30
ClientAliveCountMax 4
