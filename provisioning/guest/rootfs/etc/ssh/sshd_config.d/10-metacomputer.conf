# metacomputer: keys only, four named users, no forwarding. Reached only through the
# host's cua-netgw forward on 127.0.0.1. mcfill is the secrets fill account
# (15-metacomputer-fill.conf): key only, one forced command. mcproxy is the secrets
# proxy account (16-metacomputer-proxy.conf): key only, one reverse forward to loopback.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers cua cuaadmin mcfill mcproxy
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
ClientAliveInterval 30
ClientAliveCountMax 4
