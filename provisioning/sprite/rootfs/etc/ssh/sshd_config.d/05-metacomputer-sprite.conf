# metacomputer on Fly Sprites: sshd listens on the Sprite's own loopback only, by number (on a Sprite, "localhost" is
# the Sprite's network address, not loopback). The Mac reaches it through Fly's authenticated tunnel
# (sprite proxy -W :22), run as ssh's ProxyCommand; nothing else can.
ListenAddress 127.0.0.1
ListenAddress ::1
