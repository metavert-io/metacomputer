id = "calc-sort"
title = "Calc: sort rows by a date column, header kept"
apps = ["libreoffice-calc"]
requires = ["calc"]
route = "ax"
timeout_s = 720
files = ["sheets/members.csv"]
setup = """
to_odf ods ~/bench/members.csv ~/bench/sheets && rm ~/bench/members.csv
"""
prompt = """
Open ~/bench/sheets/members.ods in LibreOffice Calc and sort the members by the Joined date,
oldest first. Keep the header row at the top and each member's cells together. Save the file,
keeping the .ods format.
"""
check = """
rows = ods_rows("~/bench/sheets/members.ods")[0]
orig = {"Ivo Brandt": ("Lakeside", "2019-06-02"), "Pema Lhamo": ("Northgate", "2016-11-20"),
        "Odile Marchetti": ("Riverton", "2021-01-15"), "Kofi Mensah": ("Lakeside", "2014-03-09"),
        "Saanvi Rao": ("Hillcrest", "2018-08-30"), "Tomas Herrera": ("Northgate", "2022-05-11"),
        "Lin Zhou": ("Riverton", "2015-07-04")}
C.add("header on top", 0.1, [c["text"] for c in rows[0][:3]] == ["Name", "City", "Joined"] if rows else False)
got = [(r[0]["text"], r[1]["text"], (r[2]["value"] or r[2]["text"])[:10]) for r in rows[1:] if len(r) >= 3]
C.add("rows kept together", 0.4, sorted(got) == sorted((n, c, d) for n, (c, d) in orig.items()), got[:3])
order = [n for n, _, _ in got]
C.add("oldest first", 0.5, order == sorted(orig, key=lambda n: orig[n][1]), order)
"""
