<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Choose your seats - Northline coach 412</title>
<style>
body{font-family:sans-serif;margin:2em}
canvas{display:block;margin:1em 0;border:1px solid #888;cursor:pointer}
#status{font-weight:bold}
input{font-size:1em;padding:.3em}
button{font-size:1em;padding:.3em .8em}
</style></head>
<body>
<h1>Choose your seats</h1>
<p>Northline coach 412, Larkhaven to Merrow Point. Click a free seat on the map to select it, and click it
again to undo. Grey seats are taken.</p>
<canvas id="map" width="420" height="420" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite">Selected seats: none</p>
<form id="f" method="post" action="/book">
  <input type="hidden" id="seats" name="seats" value="">
  <p><label for="passenger">Passenger name</label> <input id="passenger" name="passenger" type="text" autocomplete="off"></p>
  <p><button type="button" id="clear">Clear selection</button> <button type="submit">Confirm booking</button></p>
</form>
<script>
(function () {
  // A seat map drawn on a canvas only: the seats are not in the page's accessibility tree.
  var cols = {A: 30, B: 110, C: 240, D: 320}, W = 70, H = 46, ROWS = 6;
  var taken = {"1D": 1, "2A": 1, "3A": 1, "3C": 1, "4B": 1, "4D": 1, "5C": 1, "6A": 1};
  var picked = {};
  var cv = document.getElementById("map"), g = cv.getContext("2d");
  var status = document.getElementById("status"), field = document.getElementById("seats");
  function top(r) { return 60 + (r - 1) * 58; }
  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.fillStyle = "#555"; g.font = "bold 16px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("FRONT", 210, 26);
    for (var r = 1; r <= ROWS; r++) {
      for (var c in cols) {
        var id = r + c, x = cols[c], y = top(r);
        g.fillStyle = taken[id] ? "#b8b8b8" : (picked[id] ? "#1565c0" : "#ffffff");
        g.strokeStyle = "#333"; g.lineWidth = 2;
        g.fillRect(x, y, W, H); g.strokeRect(x, y, W, H);
        g.fillStyle = picked[id] ? "#ffffff" : (taken[id] ? "#666" : "#111");
        g.font = "bold 18px sans-serif";
        g.fillText(id, x + W / 2, y + H / 2);
      }
    }
  }
  function show(msg) {
    var ids = Object.keys(picked).sort(function (a, b) { return parseInt(a) - parseInt(b) || a.localeCompare(b); });
    field.value = ids.join(",");
    status.textContent = msg || ("Selected seats: " + (ids.length ? ids.join(", ") : "none"));
  }
  cv.addEventListener("click", function (e) {
    var b = cv.getBoundingClientRect();
    var px = (e.clientX - b.left) * cv.width / b.width, py = (e.clientY - b.top) * cv.height / b.height;
    for (var r = 1; r <= ROWS; r++) {
      for (var c in cols) {
        var id = r + c;
        if (px >= cols[c] && px <= cols[c] + W && py >= top(r) && py <= top(r) + H) {
          if (taken[id]) { show("Seat " + id + " is already taken."); return; }
          if (picked[id]) { delete picked[id]; } else { picked[id] = 1; }
          draw(); show(); return;
        }
      }
    }
  });
  document.getElementById("clear").addEventListener("click", function () { picked = {}; draw(); show(); });
  document.getElementById("f").addEventListener("submit", function (e) {
    if (!field.value) { e.preventDefault(); show("Pick at least one seat first."); }
  });
  draw(); show();
})();
</script>
</body></html>
