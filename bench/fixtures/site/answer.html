<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Answer form</title>
<style>body{font-family:sans-serif;margin:2em} label{display:block;margin:.8em 0 .2em} input{font-size:1em;padding:.3em}</style></head>
<body>
<h1>Answer form</h1>
<form method="get" action="/answer">
  <label for="order">Order number</label><input id="order" name="order" type="text" autocomplete="off">
  <label for="total">Order total</label><input id="total" name="total" type="text" autocomplete="off">
  <p><button type="submit">Submit answer</button></p>
</form>
</body></html>
