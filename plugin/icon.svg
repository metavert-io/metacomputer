<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>metacomputer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the screen -->
  <rect x="80" y="112" width="352" height="256" rx="30" fill="#0B1224" stroke="url(#frame)" stroke-width="16"/>
  <line x1="88" y1="170" x2="424" y2="170" stroke="#818CF8" stroke-opacity="0.45" stroke-width="6"/>
  <circle cx="126" cy="142" r="10" fill="#C084FC"/>
  <circle cx="158" cy="142" r="10" fill="#818CF8"/>
  <circle cx="190" cy="142" r="10" fill="#06B6D4"/>
  <!-- a prompt on the screen -->
  <polyline points="128,222 164,252 128,282" fill="none" stroke="#34D399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="184" y1="284" x2="244" y2="284" stroke="#34D399" stroke-width="16" stroke-linecap="round"/>
  <!-- the stand -->
  <rect x="220" y="376" width="72" height="34" fill="#818CF8" fill-opacity="0.75"/>
  <rect x="168" y="404" width="176" height="22" rx="11" fill="url(#frame)"/>
  <!-- the agent's pointer -->
  <path d="M300 214 L300 338 L330 310 L352 356 L374 346 L352 300 L392 298 Z" fill="#F8FAFC" stroke="#0B1224" stroke-width="10" stroke-linejoin="round"/>
</svg>
