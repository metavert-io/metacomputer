<!doctype html>
<html><head><meta charset="utf-8"><title>Typing check</title></head>
<body>
<h1>Typing check</h1>
<label for="box">Box</label>
<textarea id="box" rows="6" cols="60"></textarea>
<p><button id="send">Send</button> <span id="state">idle</span></p>
<script>
document.getElementById("send").addEventListener("click", function () {
  fetch("/save", {method: "POST", headers: {"Content-Type": "text/plain; charset=utf-8"},
                  body: document.getElementById("box").value})
    .then(function (r) { document.getElementById("state").textContent = "saved " + r.status; });
});
</script>
</body></html>
