<!doctype html>
<html><head><meta charset="utf-8"><title>Example - enter your code</title></head>
<body>
<h1 id="h">Enter your sign-in code</h1>
<form id="f" onsubmit="event.preventDefault(); var v=document.getElementById('otp').value; document.getElementById('r').textContent='Signed in: code ' + v.length + ' characters' + (v === '482913' ? ' (matches)' : ' (no match)');">
  <label for="otp">Code</label> <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code">
  <label for="note">Note</label> <input id="note" name="note" type="text">
  <label for="pw">Password</label> <input id="pw" name="pw" type="password">
  <button id="go" type="submit">Continue</button>
</form>
<p id="r">Not signed in</p>
<script>if (location.search.indexOf('signed-in=1') >= 0) { document.getElementById('h').textContent = 'Signed in by link'; document.getElementById('r').textContent = 'Signed in: link'; }</script>
</body></html>
