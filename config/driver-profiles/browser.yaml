# DRIVER_PROFILE=browser (DRIVER_MODE=bounded): page tools only, in a
# throwaway browser profile, on the sites listed in DRIVER_ORIGINS. Cua Driver
# refuses desktop input and screen reads in this runtime (they would see any
# tab), so this is the page-level browser mode only. Page tools drive Chrome,
# so the VM needs it (BROWSERS="firefox chrome").
# Cua Driver capability manifest v3; @NAME@ placeholders are filled in by
# lib/driver_profiles.py.
version: 3
expires_after: @EXPIRES@
idle_timeout: @IDLE@
allow:
  tools:
    - start_session
    - end_session
    - get_session
    - list_sessions
    - list_windows
    - browser_prepare
    - get_browser_state
    - browser_navigate
    - browser_click
    - browser_type
    - browser_select
    - browser_set_input_files
    - browser_download
    - browser_dialog
    - start_recording
    - stop_recording
    - get_recording_state
resources:
  apps:
    - {executable: /opt/google/chrome/chrome}   # the driver's own Chrome window (to bind page tools to it)
  browser:
    profiles:
      - kind: isolated
    origins:
      - about:blank                             # the new tab it starts on
@ORIGINS@
  files:
    read:
      - {dir: @HOME@/virtual-computer-runs, recursive: true}
      - {dir: @HOME@/Inbox, recursive: true}
    write:
      - {dir: @HOME@/virtual-computer-runs, recursive: true}
      - {dir: @HOME@/Downloads, recursive: true}
  desktop:
    display: false
